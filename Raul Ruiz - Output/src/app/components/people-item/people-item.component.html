<div class="card h-100 people-card" role="button" tabindex="0"
     (click)="onClick()" (keydown.enter)="onClick()">
  <div class="card-body">
    <h5 class="card-title">{{ people().name }}</h5>
    <p class="card-text text-muted mb-0">Nacimiento: {{ people().birth_year }}</p>
    <p class="card-text text-muted mb-0">Género: {{ people().gender }}</p>
  </div>
</div>
